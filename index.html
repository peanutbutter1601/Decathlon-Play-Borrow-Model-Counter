<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Decathlon Play &amp; Borrow — Interactive 3D Booth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      touch-action: none;
    }

    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* Full-Screen White Splash Preloader */
    #splash-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.55s ease;
    }

    #splash-preloader.hidden-splash {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3.5px solid #e2e8f0;
      border-top-color: #0046c8;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Hide UI panels cleanly until everything is ready */
    .ui-reveal {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.app-ready .ui-reveal {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 10px 30px -6px rgba(15, 23, 42, 0.10), 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .ctrl-btn {
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    .ctrl-btn.active {
      background-color: #0046c8;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 70, 200, 0.28);
    }

    .item-btn {
      transition: all 0.18s ease;
    }

    .item-btn:hover {
      background-color: #eff6ff;
      border-color: #bfdbfe;
      color: #0046c8;
    }

    .item-btn.active {
      background-color: #0046c8;
      border-color: #0046c8;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 70, 200, 0.26);
    }

    /* Hide scrollbar cleanly on horizontal mobile toolbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

  <!-- Full-Screen Clean White Preloader -->
  <div id="splash-preloader" role="status" aria-live="polite">
    <div class="loader-ring"></div>
    <div class="text-center">
      <div class="text-sm font-extrabold tracking-wider text-[#0046c8] uppercase">DECATHLON PLAY &amp; BORROW</div>
      <div class="text-xs text-slate-400 mt-1 font-medium">Loading 3D booth and interior gear...</div>
    </div>
  </div>

  <!-- 3D WebGL Viewport -->
  <div id="canvas-container"></div>

  <!-- Top-Left Minimal Brand Pill -->
  <div class="ui-reveal fixed top-3 left-3 sm:top-4 sm:left-4 z-20">
    <div class="glass-panel rounded-2xl px-3.5 py-2 flex items-center gap-2.5">
      <span class="w-2.5 h-2.5 rounded-full bg-[#0046c8] shadow-sm"></span>
      <div class="leading-tight">
        <div class="text-xs sm:text-sm font-extrabold tracking-tight text-slate-900">DECATHLON <span class="text-[#0046c8]">play &amp; borrow</span></div>
        <div class="text-[10px] sm:text-[11px] text-slate-500 font-medium">5.00 × 3.00 × 3.00 m • Drag to Orbit / Scroll to Zoom</div>

    </div>

  <!-- Top-Right Separate Item Inspection Panel -->

      </button>

      <div id="item-panel-body" class="mt-2 grid grid-cols-2 gap-1.5">
        <button type="button" data-view="poster" class="item-btn px-2 py-2 rounded-xl border border-slate-200/80 bg-white/80 text-[11px] font-semibold text-slate-700 flex items-center justify-center">

        <button type="button" data-view="counter" class="item-btn px-2 py-2 rounded-xl border border-slate-200/80 bg-white/80 text-[11px] font-semibold text-slate-700 flex items-center justify-center">

        <button type="button" data-view="shuttles" class="item-btn px-2 py-2 rounded-xl border border-slate-200/80 bg-white/80 text-[11px] font-semibold text-slate-700 flex items-center justify-center">

        <button type="button" data-view="shoes" class="item-btn px-2 py-2 rounded-xl border border-slate-200/80 bg-white/80 text-[11px] font-semibold text-slate-700 flex items-center justify-center">
          Shoes

        <button type="button" data-view="socks" class="item-btn px-2 py-2 rounded-xl border border-slate-200/80 bg-white/80 text-[11px] font-semibold text-slate-700 flex items-center justify-center">
          Socks
        </button>

  </div>

  <!-- Bottom Compact Exterior Views & Booth Controls Bar -->
  <div class="ui-reveal fixed bottom-3 sm:bottom-5 left-1/2 -translate-x-1/2 z-20 max-w-[96vw]">
    <div class="glass-panel rounded-2xl px-2 py-1.5 flex items-center gap-1 overflow-x-auto no-scrollbar">
      <!-- Exterior View Presets -->
      <button type="button" data-view="iso" class="ctrl-btn active px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">3D View</button>
      <button type="button" data-view="front" class="ctrl-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Front</button>
      <button type="button" data-view="back" class="ctrl-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Back</button>
      <button type="button" data-view="left" class="ctrl-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Left</button>
      <button type="button" data-view="right" class="ctrl-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Right</button>
      <button type="button" data-view="top" class="ctrl-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Top</button>

      <div class="w-px h-5 bg-slate-200 mx-1 shrink-0"></div>

      <!-- Interactive Booth Feature Toggles -->
      <button id="btn-door" type="button" class="ctrl-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Door</button>
      <button id="btn-glass" type="button" class="ctrl-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Hide Glass</button>
      <button id="btn-lights" type="button" class="ctrl-btn active px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Interior Lights</button>
      <button id="btn-dims" type="button" class="ctrl-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Dimensions</button>
      <button id="btn-rotate" type="button" class="ctrl-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Auto Rotate</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // =========================================================================
    // 1. CONSTANTS, GITHUB ASSET URLS & CAMERA PRESETS
    // =========================================================================
    const BOOTH = {
      W: 5.00,
      D: 3.00,
      H: 3.00,
      FOOT_H: 0.16,
      TUBE_R: 0.085,
      FLOOR_Y: 0.33,
      CEIL_Y: 2.98,
      BANNER_H: 0.76
    };

    const GITHUB_BASE = 'https://raw.githubusercontent.com/Kyst78/Decathlon/main/';

    const GITHUB_TEXTURES = {
      frontBanner: GITHUB_BASE + 'front%20side%20banner.png',
      backBanner:  GITHUB_BASE + 'back%20side%20banner.png',
      backLogo:    GITHUB_BASE + 'back%20side%20Logo.png',
      leftWall:    GITHUB_BASE + 'left%20side%20banner%20logo.png',
      rightWall:   GITHUB_BASE + 'Right%20side%20logo%20banner.png',
      poster:      GITHUB_BASE + 'poster.png',
      posScreen:   GITHUB_BASE + 'DecathlonPOS.jpg'
    };

    const GITHUB_MODELS = {
      racket:      GITHUB_BASE + 'racket.glb',
      shuttlecock: GITHUB_BASE + 'Shuttlecock.glb',
      tube:        GITHUB_BASE + 'shuttlecock%20container.glb',
      shoes:       GITHUB_BASE + 'shoes.glb',
      socks:       GITHUB_BASE + 'socks.glb'
    };

    const INTERIOR_VIEWS = new Set(['counter', 'rackets', 'shuttles', 'shoes', 'socks']);

    const CAMERA_VIEWS = {
      // Exterior Views
      iso:      { pos: [5.55, 2.82, 6.55],   target: [0.00, 1.62, 0.00] },
      front:    { pos: [0.00, 1.66, 7.80],   target: [0.00, 1.62, 0.00] },
      back:     { pos: [0.00, 1.66, -7.80],  target: [0.00, 1.62, 0.00] },
      left:     { pos: [-7.40, 1.66, 0.00],  target: [0.00, 1.62, 0.00] },
      right:    { pos: [7.40, 1.66, 0.00],   target: [0.00, 1.62, 0.00] },
      top:      { pos: [0.00, 9.05, 0.01],   target: [0.00, 1.55, 0.00] },

      // Item Inspection Close-Ups
      poster:   { pos: [-1.755, 2.04, 4.35],  target: [-1.755, 2.04, 1.37] },
      counter:  { pos: [-0.46, 1.71, -1.04],  target: [-0.46, 1.33, -0.28] },
      rackets:  { pos: [0.58, 1.90, 0.28],    target: [0.58, 1.81, -1.18] },
      shuttles: { pos: [0.50, 1.33, 0.02],    target: [0.58, 1.20, -1.04] },
      shoes:    { pos: [1.54, 1.83, 0.30],    target: [1.68, 1.77, -1.05] },
      socks:    { pos: [1.68, 1.25, -0.14],   target: [1.68, 1.20, -0.98] }
    };

    // =========================================================================
    // 2. GLOBAL SCENE STATE
    // =========================================================================
    let scene, camera, renderer, controls;
    let maxAnisotropy = 8;
    let boothGroup, dimensionsGroup, doorPivot, frontGlassGroup;

    const interiorLights = [];
    const ceilingBulbMats = [];
    const productSlots = {};

    let activeView = 'iso';
    let doorOpen = false;
    let currentDoorAngle = 0;
    let userHidGlass = false;
    let lightsOn = true;
    let showDimensions = false;
    let camAnim = null;

    // =========================================================================
    // 3. PROCEDURAL STUDIO TEXTURES & GITHUB IMAGE LOADERS
    // =========================================================================
    function finalizeTexture(canvas) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = maxAnisotropy;
      tex.needsUpdate = true;
      return tex;
    }

    function loadImageCORS(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = (err) => reject(err);
        img.src = url;
      });
    }

    /** Applies an exact GitHub artwork image directly onto a material (high anisotropy + sRGB) */
    function applyDirectImageTexture(material, url) {
      return loadImageCORS(url)
        .then(img => {
          const tex = new THREE.Texture(img);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = maxAnisotropy;
          tex.minFilter = THREE.LinearMipmapLinearFilter;
          tex.magFilter = THREE.LinearFilter;
          tex.needsUpdate = true;
          material.map = tex;
          material.color.setHex(0xffffff);
          material.needsUpdate = true;
        })
        .catch(() => {
          // Keep clean fallback material if offline
        });
    }

    /** Loads back-side Logo.png onto the 3-panel architectural white back wall with subtle seams & rivets */
    function applyBackUpperWallTexture(material, url) {
      const renderPanel = (logoImg) => {
        const c = document.createElement('canvas');
        c.width = 2048;
        c.height = 820;
        const ctx = c.getContext('2d');

        // Clean satin architectural white base
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, c.width, c.height);

        // Subtle panel frame inset border
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 4;
        ctx.strokeRect(26, 22, c.width - 52, c.height - 44);

        // Two vertical architectural panel seam lines (3-bay exterior cladding)
        const seam1 = c.width * 0.285;
        const seam2 = c.width * 0.715;
        ctx.strokeStyle = '#d1d8e0';
        ctx.lineWidth = 3;
        [seam1, seam2].forEach(sx => {
          ctx.beginPath();
          ctx.moveTo(sx, 22);
          ctx.lineTo(sx, c.height - 22);
          ctx.stroke();
        });

        // Subtle recessed aluminum corner rivets on each of the 3 panels
        const rivets = [
          [52, 46], [seam1 - 24, 46], [seam1 + 24, 46], [seam2 - 24, 46], [seam2 + 24, 46], [c.width - 52, 46],
          [52, c.height - 46], [seam1 - 24, c.height - 46], [seam1 + 24, c.height - 46],
          [seam2 - 24, c.height - 46], [seam2 + 24, c.height - 46], [c.width - 52, c.height - 46]
        ];
        rivets.forEach(([rx, ry]) => {
          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.arc(rx, ry, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(rx - 1.2, ry - 1.2, 1.8, 0, Math.PI * 2);
          ctx.fill();
        });

        if (logoImg) {
          // Softly blend logo onto central bay while removing near-white background edge
          const off = document.createElement('canvas');
          off.width = logoImg.naturalWidth || logoImg.width;
          off.height = logoImg.naturalHeight || logoImg.height;
          const octx = off.getContext('2d');
          octx.drawImage(logoImg, 0, 0);
          try {
            const id = octx.getImageData(0, 0, off.width, off.height);
            const d = id.data;
            for (let i = 0; i < d.length; i += 4) {
              const r = d[i], g = d[i + 1], b = d[i + 2];
              if (r > 238 && g > 238 && b > 238) {
                d[i + 3] = 0;
              } else if (r > 218 && g > 218 && b > 218) {
                const lum = (r + g + b) / 3;
                d[i + 3] = Math.round(d[i + 3] * Math.max(0, (238 - lum) / 20));
              }
            }
            octx.putImageData(id, 0, 0);
          } catch (_) {
            // If tainted, draw directly
          }

          const maxW = (seam2 - seam1) * 0.72;
          const maxH = c.height * 0.60;
          const scale = Math.min(maxW / off.width, maxH / off.height);
          const dw = off.width * scale;
          const dh = off.height * scale;
          ctx.drawImage(off, (c.width - dw) / 2, (c.height - dh) / 2 - 8, dw, dh);
        }

        material.map = finalizeTexture(c);
        material.needsUpdate = true;
      };

      renderPanel(null);
      return loadImageCORS(url).then(img => renderPanel(img)).catch(() => {});
    }

    /** Cuts out pure white background from back side Logo.png for clean mounting on interior satin wall */
    function applyInteriorLogoCutout(material, url) {
      return loadImageCORS(url)
        .then(img => {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth || img.width;
          c.height = img.naturalHeight || img.height;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0);

          try {
            const id = ctx.getImageData(0, 0, c.width, c.height);
            const d = id.data;
            for (let i = 0; i < d.length; i += 4) {
              const r = d[i], g = d[i + 1], b = d[i + 2];
              if (r > 235 && g > 235 && b > 235) {
                d[i + 3] = 0;
              } else if (r > 210 && g > 210 && b > 210) {
                const lum = (r + g + b) / 3;
                d[i + 3] = Math.round(d[i + 3] * Math.max(0, (235 - lum) / 25));
              }
            }
            ctx.putImageData(id, 0, 0);
          } catch (_) {}

          material.map = finalizeTexture(c);
          material.transparent = true;
          material.alphaTest = 0.02;
          material.opacity = 1;
          material.needsUpdate = true;
        })
        .catch(() => {});
    }

    /** Clean satin architectural interior wall texture with refined soft corner & ceiling AO */
    function createWallAOTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f2f5f9';
      ctx.fillRect(0, 0, c.width, c.height);

      // Subtle top ceiling contact shadow
      const topG = ctx.createLinearGradient(0, 0, 0, 88);
      topG.addColorStop(0, 'rgba(30, 41, 59, 0.14)');
      topG.addColorStop(1, 'rgba(30, 41, 59, 0)');
      ctx.fillStyle = topG;
      ctx.fillRect(0, 0, c.width, 88);

      // Subtle bottom floor contact shadow
      const botG = ctx.createLinearGradient(0, c.height - 78, 0, c.height);
      botG.addColorStop(0, 'rgba(30, 41, 59, 0)');
      botG.addColorStop(1, 'rgba(30, 41, 59, 0.15)');
      ctx.fillStyle = botG;
      ctx.fillRect(0, c.height - 78, c.width, 78);

      // Gentle left & right corner AO
      const leftG = ctx.createLinearGradient(0, 0, 72, 0);
      leftG.addColorStop(0, 'rgba(30, 41, 59, 0.10)');
      leftG.addColorStop(1, 'rgba(30, 41, 59, 0)');
      ctx.fillStyle = leftG;
      ctx.fillRect(0, 0, 72, c.height);

      const rightG = ctx.createLinearGradient(c.width - 72, 0, c.width, 0);
      rightG.addColorStop(0, 'rgba(30, 41, 59, 0)');
      rightG.addColorStop(1, 'rgba(30, 41, 59, 0.10)');
      ctx.fillStyle = rightG;
      ctx.fillRect(c.width - 72, 0, 72, c.height);

      return finalizeTexture(c);
    }

    /** Light grey architectural wood-laminate flooring texture with plank seams & subtle grain */
    function createFloorLaminateTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#dfe4eb';
      ctx.fillRect(0, 0, c.width, c.height);

      const plankRows = 12;
      const plankH = c.height / plankRows;
      for (let r = 0; r < plankRows; r++) {
        const y = r * plankH;
        const offset = (r % 2 === 0) ? 0 : 256;
        for (let col = -1; col < 3; col++) {
          const x = col * 512 + offset;
          const shade = 218 + ((r * 7 + col * 13) % 12);
          ctx.fillStyle = `rgb(${shade}, ${shade + 4}, ${shade + 9})`;
          ctx.fillRect(x, y, 512, plankH);

          // Subtle wood grain streaks
          ctx.strokeStyle = 'rgba(100, 116, 139, 0.07)';
          ctx.lineWidth = 1.5;
          for (let g = 0; g < 6; g++) {
            const gy = y + 10 + g * ((plankH - 18) / 6);
            ctx.beginPath();
            ctx.moveTo(x, gy);
            ctx.bezierCurveTo(x + 170, gy + 2, x + 340, gy - 2, x + 512, gy);
            ctx.stroke();
          }

          // Plank seam border
          ctx.strokeStyle = 'rgba(100, 116, 139, 0.22)';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, 512, plankH);
        }
      }

      const tex = finalizeTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2.2, 1.4);
      return tex;
    }

    /** Clean perforated retail pegboard texture for the badminton racket wall */
    function createPegboardTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#e8edf3';
      ctx.fillRect(0, 0, 512, 512);

      // Subtle architectural grid lines
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.24)';
      ctx.lineWidth = 1;
      const step = 24;
      for (let x = 12; x < 512; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 512);
        ctx.stroke();
      }
      for (let y = 12; y < 512; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(512, y);
        ctx.stroke();
      }

      // Peg holes
      ctx.fillStyle = '#64748b';
      for (let y = 12; y < 512; y += step) {
        for (let x = 12; x < 512; x += step) {
          ctx.beginPath();
          ctx.arc(x, y, 2.3, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      return finalizeTexture(c);
    }

    // 4. HIGH-DETAIL ARCHITECTURAL & FIXTURE GEOMETRY BUILDERS

    /**
     * Precision 3D seamless tubular steel exoskeleton:
     * All 12 perimeter rails meet mathematically at the exact 8 spherical corner nodes
     * (cylinder radius === corner sphere radius === tubeR), guaranteeing watertight G1 tangent
     * joints with zero gaps or protruding corners from every viewing angle.
     */
    function buildSeamlessBlueFrame(w, d, h, footH, tubeR, mat) {
      const g = new THREE.Group();
      const cx = w / 2 - tubeR;
      const cz = d / 2 - tubeR;
      const cyBot = footH + tubeR;
      const cyTop = footH + h - tubeR;
      const cyMid = footH + h / 2;

      const xBarLen = w - tubeR * 2;
      const yBarLen = h - tubeR * 2;
      const zBarLen = d - tubeR * 2;

      // 4 Horizontal X-axis beams (front/back top & bottom)
      const xBarGeo = new THREE.CylinderGeometry(tubeR, tubeR, xBarLen, 32);
      xBarGeo.rotateZ(Math.PI / 2);
      [cyBot, cyTop].forEach(y => {
        [-cz, cz].forEach(z => {
          const bar = new THREE.Mesh(xBarGeo, mat);
          bar.position.set(0, y, z);
          bar.castShadow = true;
          bar.receiveShadow = true;
          g.add(bar);
        });
      });

      // 4 Vertical Y-axis corner columns
      const yBarGeo = new THREE.CylinderGeometry(tubeR, tubeR, yBarLen, 32);
      [-cx, cx].forEach(x => {
        [-cz, cz].forEach(z => {
          const col = new THREE.Mesh(yBarGeo, mat);
          col.position.set(x, cyMid, z);
          col.castShadow = true;
          col.receiveShadow = true;
          g.add(col);
        });
      });

      // 4 Horizontal Z-axis side beams (left/right top & bottom)
      const zBarGeo = new THREE.CylinderGeometry(tubeR, tubeR, zBarLen, 32);
      zBarGeo.rotateX(Math.PI / 2);
      [-cx, cx].forEach(x => {
        [cyBot, cyTop].forEach(y => {
          const bar = new THREE.Mesh(zBarGeo, mat);
          bar.position.set(x, y, 0);
          bar.castShadow = true;
          bar.receiveShadow = true;
          g.add(bar);
        });
      });

      // 8 Exact-radius Spherical Corner Nodes seamlessly unifying X, Y & Z rails
      const cornerSphereGeo = new THREE.SphereGeometry(tubeR, 32, 32);
      [-cx, cx].forEach(x => {
        [cyBot, cyTop].forEach(y => {
          [-cz, cz].forEach(z => {
            const node = new THREE.Mesh(cornerSphereGeo, mat);
            node.position.set(x, y, z);
            node.castShadow = true;
            node.receiveShadow = true;
            g.add(node);
          });
        });
      });

      return g;
    }

    /** Rounded molded fiberglass roof / chassis deck with top aligned at local y = 0 */
    function buildRoundedRoofCap(w, d, h, cornerR, mat) {
      const hw = w / 2;
      const hd = d / 2;
      const r = Math.min(cornerR, hw * 0.45, hd * 0.45);
      const shape = new THREE.Shape();
      shape.moveTo(-hw + r, -hd);
      shape.lineTo(hw - r, -hd);
      shape.quadraticCurveTo(hw, -hd, hw, -hd + r);
      shape.lineTo(hw, hd - r);
      shape.quadraticCurveTo(hw, hd, hw - r, hd);
      shape.lineTo(-hw + r, hd);
      shape.quadraticCurveTo(-hw, hd, -hw, hd - r);
      shape.lineTo(-hw, -hd + r);
      shape.quadraticCurveTo(-hw, -hd, -hw + r, -hd);

      const bevel = Math.min(0.012, h * 0.35);
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: Math.max(0.004, h - bevel * 2),
        bevelEnabled: true,
        bevelThickness: bevel,
        bevelSize: bevel,
        bevelSegments: 3
      });
      geo.rotateX(Math.PI / 2);
      geo.translate(0, -bevel, 0);

      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    /** Sculpted ceramic counter potted plant with arched 3D foliage leaves */
    function buildPottedPlant(mats) {
      const g = new THREE.Group();

      // Smooth rounded ceramic pot via LatheGeometry
      const potPts = [
        new THREE.Vector2(0.0, 0.0),
        new THREE.Vector2(0.056, 0.0),
        new THREE.Vector2(0.072, 0.045),
        new THREE.Vector2(0.076, 0.105),
        new THREE.Vector2(0.068, 0.132),
        new THREE.Vector2(0.060, 0.132),
        new THREE.Vector2(0.058, 0.105)
      ];
      const pot = new THREE.Mesh(new THREE.LatheGeometry(potPts, 28), mats.ceramicWhite);
      pot.castShadow = true;
      pot.receiveShadow = true;
      g.add(pot);

      const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.060, 0.014, 20), mats.soil);
      soil.position.y = 0.118;
      g.add(soil);

      // Tapered curved leaf geometry shared across radial foliage layers
      const leafGeo = new THREE.PlaneGeometry(0.036, 0.17, 2, 8);
      const lPos = leafGeo.attributes.position;
      for (let i = 0; i < lPos.count; i++) {
        const y = lPos.getY(i);
        // Clamp to [0, 1] because Float32 storage of -0.085 evaluates slightly below -0.085,
        // which would make t negative and cause Math.pow(t, 1.85) to return NaN.
        const t = Math.max(0, Math.min(1, (y + 0.085) / 0.17));
        const widthFactor = Math.sin(t * Math.PI) * 0.92 + 0.08;
        lPos.setX(i, lPos.getX(i) * widthFactor);
        const archZ = Math.pow(t, 1.85) * 0.078;
        lPos.setZ(i, archZ);
        lPos.setY(i, t * 0.17);
      }
      lPos.needsUpdate = true;
      leafGeo.computeVertexNormals();
      leafGeo.computeBoundingBox();
      leafGeo.computeBoundingSphere();

      const leafCount = 13;
      for (let i = 0; i < leafCount; i++) {
        const isInner = i < 5;
        const angle = (i / (isInner ? 5 : 8)) * Math.PI * 2 + (isInner ? 0.3 : 0.0);
        const leaf = new THREE.Mesh(leafGeo, i % 2 === 0 ? mats.leafGreen : mats.leafDark);
        leaf.position.set(Math.sin(angle) * 0.012, 0.116, Math.cos(angle) * 0.012);
        leaf.rotation.y = angle;
        leaf.rotation.x = isInner ? 0.16 : 0.44 + (i % 3) * 0.08;
        const sc = isInner ? 0.92 : 1.05 + (i % 2) * 0.12;
        leaf.scale.set(sc, sc, sc);
        leaf.castShadow = true;
        g.add(leaf);
      }

      return g;
    }

        tab.position.set(sx, frontLowH + (h - frontLowH - frontTopH) / 2, d / 2 - t / 2);

      // Molded top lip rim around perimeter
      const rimThickness = 0.010;
      const rimOut = 0.008;
      const rimFront = new THREE.Mesh(new THREE.BoxGeometry(w + rimOut * 2, rimThickness, t + rimOut), mats.acrylicBlue);

        rimSide.position.set(rx, h, 0);
        g.add(rimSide);

      return g;
    }

    /** Detailed contoured retail thermal receipt printer with curled printed paper & status LEDs */
    function buildReceiptPrinter(mats) {
      const g = new THREE.Group();

      // Side profile extruded along X for smooth curved front clamshell contour
      const profile = new THREE.Shape();
      profile.moveTo(-0.082, 0.004);
      profile.lineTo(0.072, 0.004);
      profile.quadraticCurveTo(0.085, 0.006, 0.085, 0.024);
      profile.lineTo(0.083, 0.078);
      profile.quadraticCurveTo(0.080, 0.112, 0.048, 0.116);
      profile.lineTo(-0.068, 0.116);
      profile.quadraticCurveTo(-0.084, 0.114, -0.084, 0.096);
      profile.lineTo(-0.084, 0.016);
      profile.quadraticCurveTo(-0.084, 0.004, -0.082, 0.004);

      const bodyGeo = new THREE.ExtrudeGeometry(profile, {
        depth: 0.124,
        bevelEnabled: true,
        bevelThickness: 0.008,
        bevelSize: 0.007,
        bevelSegments: 4
      });
      bodyGeo.rotateY(-Math.PI / 2);
      bodyGeo.translate(0.062, 0, 0);
      const body = new THREE.Mesh(bodyGeo, mats.charcoal);
      body.castShadow = true;
      body.receiveShadow = true;
      g.add(body);

      // 4 rubber feet pads
      const footGeo = new THREE.CylinderGeometry(0.009, 0.009, 0.005, 12);
      [[-0.048, -0.058], [0.048, -0.058], [-0.048, 0.058], [0.048, 0.058]].forEach(([fx, fz]) => {
        const ft = new THREE.Mesh(footGeo, mats.rubberDark);
        ft.position.set(fx, 0.0025, fz);
        g.add(ft);
      });

      // Satin top lid inset & recessed thermal paper slot with metallic tear bar
      const topLid = new THREE.Mesh(new THREE.BoxGeometry(0.118, 0.006, 0.112), mats.rubberDark);
      topLid.position.set(0, 0.121, -0.014);
      g.add(topLid);

      const slotCavity = new THREE.Mesh(new THREE.BoxGeometry(0.090, 0.010, 0.014), mats.rubberDark);
      slotCavity.position.set(0, 0.123, 0.046);
      g.add(slotCavity);

      const tearBar = new THREE.Mesh(new THREE.BoxGeometry(0.088, 0.003, 0.004), mats.aluminum);
      tearBar.position.set(0, 0.126, 0.052);
      g.add(tearBar);

      // Gently curved thermal receipt paper emerging from the top exit slot
      const paperSegs = 12;
      const paperGeo = new THREE.PlaneGeometry(0.076, 0.088, 1, paperSegs);
      const pPos = paperGeo.attributes.position;
      for (let i = 0; i < pPos.count; i++) {
        const py = pPos.getY(i);
        // Clamp to [0, 1] to prevent Float32 precision underflow producing NaN in Math.pow
        const t = Math.max(0, Math.min(1, (py + 0.044) / 0.088));
        const curlZ = Math.pow(t, 1.8) * 0.022;
        pPos.setZ(i, curlZ);
      }
      pPos.needsUpdate = true;
      paperGeo.computeVertexNormals();
      paperGeo.computeBoundingBox();
      paperGeo.computeBoundingSphere();
      const paperMat = new THREE.MeshStandardMaterial({
        map: createReceiptPaperTexture(),
        roughness: 0.72,
        side: THREE.DoubleSide
      });
      const receipt = new THREE.Mesh(paperGeo, paperMat);
      receipt.position.set(0, 0.162, 0.046);
      receipt.castShadow = true;
      g.add(receipt);

      // Front brushed accent strip, cover release latch, paper feed button & LED indicators
      const frontTrim = new THREE.Mesh(new THREE.BoxGeometry(0.120, 0.016, 0.006), mats.rubberDark);
      frontTrim.position.set(0, 0.088, 0.088);
      g.add(frontTrim);

      const feedBtn = new THREE.Mesh(new THREE.CylinderGeometry(0.0065, 0.0065, 0.006, 16), mats.aluminum);
      feedBtn.rotation.x = Math.PI / 2;
      feedBtn.position.set(0.042, 0.088, 0.091);
      g.add(feedBtn);

      const latchBtn = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.012, 0.008), mats.aluminum);
      latchBtn.position.set(-0.044, 0.088, 0.090);
      g.add(latchBtn);

      const powerLed = new THREE.Mesh(
        new THREE.CircleGeometry(0.0034, 12),
        new THREE.MeshBasicMaterial({ color: 0x22c55e })
      );
      powerLed.position.set(0.022, 0.088, 0.092);
      g.add(powerLed);

      const statusLed = new THREE.Mesh(
        new THREE.CircleGeometry(0.0028, 12),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      statusLed.position.set(0.010, 0.088, 0.092);
      g.add(statusLed);

      return g;
    }

      // 6 Architectural Powder-Coated White Steel Feet with Mounting Saddles & Rubber Leveling Pads

      const footCollarGeo = new THREE.BoxGeometry(0.165, 0.026, 0.160);

      const backExtZ = -(innerD / 2 + frontWallT); // -1.380
      const leftExtX = -(innerW / 2 + frontWallT); // -2.380

        new THREE.BoxGeometry(frontWallT - 0.004, clearH + 0.036, rightCoreLen),

    // =========================================================================
    // 6. EXTERNAL GLB PRODUCT MODEL LOADER, CLEANER & CALIBRATION
    // =========================================================================

    /**
     * Safely removes ONLY a tiny disconnected floating artifact (< 4% total surface area)
     * separated from the main product by a genuine empty air gap along +Y (used solely for socks.glb).
     * Uses triangle Y-span area coverage so flat cards, handles, and shafts are NEVER cut or distorted.
     */
    function removeTinyFloatingTopIsland(root) {
      root.updateMatrixWorld(true);
      const fullBox = new THREE.Box3().setFromObject(root);
      const fullH = fullBox.max.y - fullBox.min.y;
      if (fullH <= 1e-4) return;

      const BINS = 80;
      const binArea = new Float64Array(BINS);
      let totalArea = 0;

      const a = new THREE.Vector3();
      const b = new THREE.Vector3();
      const c = new THREE.Vector3();
      const ab = new THREE.Vector3();
      const ac = new THREE.Vector3();
      const cross = new THREE.Vector3();

      // 1) Accumulate continuous triangle surface area across Y-bins
      root.traverse(obj => {
        if (!obj.isMesh || !obj.geometry?.attributes?.position) return;
        const geo = obj.geometry;
        const pos = geo.attributes.position;
        const idx = geo.index;
        const triCount = idx ? Math.floor(idx.count / 3) : Math.floor(pos.count / 3);

        for (let t = 0; t < triCount; t++) {
          const i0 = idx ? idx.getX(t * 3) : t * 3;
          const i1 = idx ? idx.getX(t * 3 + 1) : t * 3 + 1;
          const i2 = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;

          a.fromBufferAttribute(pos, i0).applyMatrix4(obj.matrixWorld);
          b.fromBufferAttribute(pos, i1).applyMatrix4(obj.matrixWorld);
          c.fromBufferAttribute(pos, i2).applyMatrix4(obj.matrixWorld);

          ab.subVectors(b, a);
          ac.subVectors(c, a);
          const area = 0.5 * cross.crossVectors(ab, ac).length();
          if (area <= 1e-10) continue;

          totalArea += area;
          const minY = Math.min(a.y, b.y, c.y);
          const maxY = Math.max(a.y, b.y, c.y);
          const b0 = Math.max(0, Math.min(BINS - 1, Math.floor(((minY - fullBox.min.y) / fullH) * BINS)));
          const b1 = Math.max(0, Math.min(BINS - 1, Math.floor(((maxY - fullBox.min.y) / fullH) * BINS)));
          const share = area / (b1 - b0 + 1);
          for (let bi = b0; bi <= b1; bi++) binArea[bi] += share;
        }
      });

      if (totalArea <= 1e-10) return;

      // 2) Scan downward from the top to detect a true zero-coverage air gap (>= 3 bins wide)
      let topBin = BINS - 1;
      while (topBin > 0 && binArea[topBin] === 0) topBin--;

      let aboveArea = 0;
      let clipBin = -1;
      for (let bi = topBin; bi >= Math.floor(BINS * 0.45); bi--) {
        if (binArea[bi] === 0) {
          let gapEnd = bi;
          while (gapEnd > 0 && binArea[gapEnd] === 0) gapEnd--;
          const gapWidth = bi - gapEnd;
          if (gapWidth >= 3 && binArea[gapEnd] > 0 && aboveArea < totalArea * 0.04) {
            clipBin = Math.floor((bi + gapEnd) / 2);
            break;
          }
          bi = gapEnd;
        } else {
          aboveArea += binArea[bi];
        }
      }

      if (clipBin < 0) return;

      const clipWorldY = fullBox.min.y + ((clipBin + 0.5) / BINS) * fullH;

      // 3) Hide or filter ONLY triangles strictly above the empty air gap (never altering kept vertices)
      const toRemove = [];
      root.traverse(obj => {
        if (!obj.isMesh || !obj.geometry?.attributes?.position) return;
        const mBox = new THREE.Box3().setFromObject(obj);
        if (mBox.min.y > clipWorldY) {
          toRemove.push(obj);
          return;
        }
        if (mBox.max.y <= clipWorldY) return;

        const geo = obj.geometry;
        const pos = geo.attributes.position;
        const idx = geo.index;
        const triCount = idx ? Math.floor(idx.count / 3) : Math.floor(pos.count / 3);
        const kept = [];
        const used = new Uint8Array(pos.count);
        let removedAny = false;

        for (let t = 0; t < triCount; t++) {
          const i0 = idx ? idx.getX(t * 3) : t * 3;
          const i1 = idx ? idx.getX(t * 3 + 1) : t * 3 + 1;
          const i2 = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;

          const y0 = a.fromBufferAttribute(pos, i0).applyMatrix4(obj.matrixWorld).y;
          const y1 = b.fromBufferAttribute(pos, i1).applyMatrix4(obj.matrixWorld).y;
          const y2 = c.fromBufferAttribute(pos, i2).applyMatrix4(obj.matrixWorld).y;

          if (Math.max(y0, y1, y2) <= clipWorldY) {
            kept.push(i0, i1, i2);
            used[i0] = 1;
            used[i1] = 1;
            used[i2] = 1;
          } else {
            removedAny = true;
          }
        }

        if (removedAny && kept.length > 0) {
          // Compute exact local center of kept vertices so unused stray vertices cannot inflate Box3
          const keptLocalBox = new THREE.Box3();
          const lv = new THREE.Vector3();
          for (let i = 0; i < pos.count; i++) {
            if (used[i]) {
              lv.fromBufferAttribute(pos, i);
              keptLocalBox.expandByPoint(lv);
            }
          }
          const keptCenter = keptLocalBox.getCenter(new THREE.Vector3());
          for (let i = 0; i < pos.count; i++) {
            if (!used[i]) {
              pos.setXYZ(i, keptCenter.x, keptCenter.y, keptCenter.z);
            }
          }
          geo.setIndex(kept);
          pos.needsUpdate = true;
          geo.computeBoundingBox();
          geo.computeBoundingSphere();
        }
      });

      toRemove.forEach(m => {
        m.visible = false;
        if (m.parent) m.parent.remove(m);
      });
    }

    /** Centers the top slice of a hanging product (sock header or racket head top rim) directly onto X=0, Z=0 */
    function alignTopCuffToOrigin(template, height, topFraction = 0.10) {
      template.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(template);
      const cutoffY = box.max.y - height * topFraction;
      let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      const v = new THREE.Vector3();

      template.traverse(obj => {
        if (!obj.isMesh || !obj.geometry?.attributes?.position) return;
        const pos = obj.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i).applyMatrix4(obj.matrixWorld);
          if (v.y >= cutoffY) {
            if (v.x < minX) minX = v.x;
            if (v.x > maxX) maxX = v.x;
            if (v.z < minZ) minZ = v.z;
            if (v.z > maxZ) maxZ = v.z;
          }
        }
      });

      if (maxX > minX && maxZ > minZ) {
        const cx = (minX + maxX) / 2;
        const cz = (minZ + maxZ) / 2;
        template.children.forEach(ch => {
          ch.position.x -= cx;
          ch.position.z -= cz;
        });
      }
    }

    /** Boosts texture sharpness (max anisotropy) across all PBR maps of a loaded GLB asset */
    function enhanceGlbTextureCrispness(mat) {
      const mapSlots = ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'bumpMap', 'emissiveMap'];
      mapSlots.forEach(slot => {
        const tex = mat[slot];
        if (!tex) return;
        tex.anisotropy = maxAnisotropy;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
        if (slot === 'map' || slot === 'emissiveMap') {
          tex.colorSpace = THREE.SRGBColorSpace;
        }
        tex.needsUpdate = true;
      });
    }

    /**
     * Converts shoes.glb materials to pure zero-specular MeshPhysicalMaterial:
     * - Preserves 100% of normalMap, bumpMap, aoMap, and baseColor fabric/stitching detail
     * - Kills dielectric specular & studio env glare completely (specularIntensity = 0, envMapIntensity = 0)
     * - Darkens linear albedo cleanly so shoes never look overexposed or washed-out under studio lighting
     */
    function tuneShoeGlbMaterials(template) {
      template.traverse(obj => {
        if (!obj.isMesh) return;
        obj.castShadow = true;
        obj.receiveShadow = true;

        const tuneMat = (oldMat) => {
          if (!oldMat) return oldMat;
          enhanceGlbTextureCrispness(oldMat);

          const baseColor = oldMat.color ? oldMat.color.clone() : new THREE.Color(0xffffff);
          if (oldMat.map) {
            // Linear-space darkening (~0.46 linear ≈ 0.70 sRGB) removes baked washout while keeping soles clean
            baseColor.multiplyScalar(0.46);
          } else {
            const lum = baseColor.r * 0.299 + baseColor.g * 0.587 + baseColor.b * 0.114;
            if (lum > 0.65) baseColor.setHex(0x222730);
            else baseColor.multiplyScalar(0.48);
          }

          const mat = new THREE.MeshPhysicalMaterial({
            color: baseColor,
            map: oldMat.map || null,
            normalMap: oldMat.normalMap || null,
            normalScale: oldMat.normalScale ? oldMat.normalScale.clone() : new THREE.Vector2(1, 1),
            bumpMap: oldMat.bumpMap || null,
            bumpScale: oldMat.bumpScale ?? 1,
            aoMap: oldMat.aoMap || null,
            aoMapIntensity: oldMat.aoMapIntensity ?? 1,
            alphaMap: oldMat.alphaMap || null,
            transparent: !!oldMat.transparent,
            opacity: oldMat.opacity ?? 1,
            alphaTest: oldMat.alphaTest ?? 0,
            side: oldMat.side ?? THREE.FrontSide,
            roughness: 1.0,
            metalness: 0.0,
            specularIntensity: 0.0,
            reflectivity: 0.0,
            clearcoat: 0.0,
            sheen: 0.0,
            envMapIntensity: 0.0,
            emissive: new THREE.Color(0x000000),
            emissiveIntensity: 0.0
          });

          mat.needsUpdate = true;
          return mat;
        };

        if (Array.isArray(obj.material)) {
          obj.material = obj.material.map(tuneMat);
        } else {
          obj.material = tuneMat(obj.material);
        }
      });
    }

    /** Soft matte cotton calibration for socks.glb so white fabric & printed Decathlon card stay crisp */
    function tuneSockGlbMaterials(template) {
      template.traverse(obj => {
        if (!obj.isMesh) return;
        const tune = (m) => {
          if (!m) return m;
          const clone = m.clone();
          enhanceGlbTextureCrispness(clone);
          if ('roughness' in clone) clone.roughness = 0.95;
          if ('metalness' in clone) clone.metalness = 0.0;
          if ('envMapIntensity' in clone) clone.envMapIntensity = 0.08;
          if (clone.color) clone.color.multiplyScalar(0.80);
          clone.needsUpdate = true;
          return clone;
        };
        obj.material = Array.isArray(obj.material) ? obj.material.map(tune) : tune(obj.material);
      });
    }

    /** Normalizes an external GLB model into a clean wrapper with predictable axes, size, and anchor */
    function normalizeGlbAsset(rawScene, options = {}) {
      const orientPivot = new THREE.Group();
      orientPivot.add(rawScene);

      rawScene.traverse(obj => {
        if (!obj.isMesh) return;
        obj.castShadow = true;
        obj.receiveShadow = true;
        const matsArr = Array.isArray(obj.material) ? obj.material : [obj.material];
        matsArr.forEach(m => {
          if (!m) return;
          enhanceGlbTextureCrispness(m);
          if ('envMapIntensity' in m) m.envMapIntensity = 0.40;
          m.needsUpdate = true;
        });
      });

      orientPivot.updateMatrixWorld(true);
      let box = new THREE.Box3().setFromObject(orientPivot);
      let sz = box.getSize(new THREE.Vector3());

      // 1) Orient longest axis to +Y if requested
      if (options.uprightAxis === 'longest') {
        if (sz.x >= sz.y && sz.x >= sz.z) {
          orientPivot.rotation.z = Math.PI / 2;
        } else if (sz.z >= sz.y && sz.z >= sz.x) {
          orientPivot.rotation.x = Math.PI / 2;
        }
      }

      orientPivot.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(orientPivot);
      sz = box.getSize(new THREE.Vector3());

      // 2) Rotate around Y so wider face faces +Z (front showcase)
      if (options.faceFrontX && sz.z > sz.x * 1.15) {
        orientPivot.rotation.y += Math.PI / 2;
      }

      // 3) Optionally remove a tiny disconnected top floating artifact AFTER upright alignment (socks only)
      if (options.removeTopFloatingIsland) {
        removeTinyFloatingTopIsland(orientPivot);
      }

      // 4) For badminton racket, verify wider oval head is in the upper half (+Y)
      //    For shuttlecock (wideBaseDown), verify wider feather skirt is in the lower half (-Y) so it stands stably
      if (options.headUp || options.wideBaseDown) {
        orientPivot.updateMatrixWorld(true);
        box = new THREE.Box3().setFromObject(orientPivot);
        const midY = (box.min.y + box.max.y) / 2;
        let topMinX = Infinity, topMaxX = -Infinity, topMinZ = Infinity, topMaxZ = -Infinity;
        let botMinX = Infinity, botMaxX = -Infinity, botMinZ = Infinity, botMaxZ = -Infinity;
        const v = new THREE.Vector3();
        orientPivot.traverse(obj => {
          if (!obj.isMesh || !obj.geometry?.attributes?.position) return;
          const pos = obj.geometry.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            v.fromBufferAttribute(pos, i).applyMatrix4(obj.matrixWorld);
            if (v.y >= midY) {
              if (v.x < topMinX) topMinX = v.x;
              if (v.x > topMaxX) topMaxX = v.x;
              if (v.z < topMinZ) topMinZ = v.z;
              if (v.z > topMaxZ) topMaxZ = v.z;
            } else {
              if (v.x < botMinX) botMinX = v.x;
              if (v.x > botMaxX) botMaxX = v.x;
              if (v.z < botMinZ) botMinZ = v.z;
              if (v.z > botMaxZ) botMaxZ = v.z;
            }
          }
        });
        const topSpan = Math.max(topMaxX - topMinX, topMaxZ - topMinZ);
        const botSpan = Math.max(botMaxX - botMinX, botMaxZ - botMinZ);
        if (options.headUp && botSpan > topSpan * 1.18) {
          orientPivot.rotation.z += Math.PI;
        } else if (options.wideBaseDown && topSpan > botSpan * 1.15) {
          orientPivot.rotation.z += Math.PI;
        }
      }

      orientPivot.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(orientPivot);
      sz = box.getSize(new THREE.Vector3());

      // 5) Uniform scale to fit within targetSize bounds
      const target = options.targetSize || { x: 0.2, y: 0.2, z: 0.2 };
      const scales = [];
      if (target.x && sz.x > 1e-5) scales.push(target.x / sz.x);
      if (target.y && sz.y > 1e-5) scales.push(target.y / sz.y);
      if (target.z && sz.z > 1e-5) scales.push(target.z / sz.z);
      const s = scales.length ? Math.min(...scales) : 1;
      orientPivot.scale.multiplyScalar(s);

      orientPivot.updateMatrixWorld(true);
      box = new THREE.Box3().setFromObject(orientPivot);
      const center = box.getCenter(new THREE.Vector3());
      const finalSize = box.getSize(new THREE.Vector3());

      const template = new THREE.Group();
      orientPivot.position.x -= center.x;
      orientPivot.position.z -= center.z;

      if (options.anchorY === 'bottom') {
        orientPivot.position.y -= box.min.y;
      } else if (options.anchorY === 'top') {
        orientPivot.position.y -= box.max.y;
      } else {
        orientPivot.position.y -= center.y;
      }

      template.add(orientPivot);
      return { template, size: finalSize };
    }

    /** Loads all 5 real GitHub GLB product models silently in parallel */
    function loadAllProductGlbs() {
      const gltfLoader = new GLTFLoader();
      gltfLoader.setCrossOrigin('anonymous');

      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
      gltfLoader.setDRACOLoader(dracoLoader);

      const loadOne = (slotKey, url, onReady) => new Promise((resolve) => {
        gltfLoader.load(
          url,
          (gltf) => {
            try {
              onReady(gltf.scene);
              if (productSlots[slotKey]?.placeholder) {
                productSlots[slotKey].placeholder.visible = false;
              }
            } catch (err) {
              console.warn('Error mounting GLB:', slotKey, err);
            }
            resolve();
          },
          undefined,
          (err) => {
            console.warn('Could not load GLB:', slotKey, err);
            resolve();
          }
        );
      });

      const r1D = 0.44;
      const pegBoardFrontZ = -r1D / 2 + 0.041;
      const racketPegY = 1.815;
      const midShelfTopY = 0.72 + 0.018;
      const railY = 1.015;
      const railZ = 0.05;

      return Promise.all([
        // 1) Badminton Rackets — 6 intact GLB rackets hung directly on chrome pegboard hooks
        loadOne('racket', GITHUB_MODELS.racket, (rawScene) => {
          const { template, size } = normalizeGlbAsset(rawScene, {
            uprightAxis: 'longest',
            faceFrontX: true,
            headUp: true,
            targetSize: { x: 0.174, y: 0.675, z: 0.055 },
            anchorY: 'top'
          });

          alignTopCuffToOrigin(template, size.y, 0.10);

          const mount = productSlots.racket.container;
          const hangTopY = racketPegY + 0.020;
          const hangZ = pegBoardFrontZ + 0.052;

          for (let i = 0; i < 6; i++) {
            const rx = -0.45 + i * 0.18;
            const clone = template.clone(true);
            clone.position.set(rx, hangTopY, hangZ);
            mount.add(clone);
          }
        }),
        // 2) Shuttlecocks — 2 standing stably on their wide feather skirt (cork pointing up)
        loadOne('shuttlecock', GITHUB_MODELS.shuttlecock, (rawScene) => {
          const { template } = normalizeGlbAsset(rawScene, {
            uprightAxis: 'longest',
            wideBaseDown: true,
            targetSize: { x: 0.072, y: 0.092, z: 0.072 },
            anchorY: 'bottom'
          });

          const mount = productSlots.shuttlecock.container;
          [-0.41, -0.28].forEach((sx, idx) => {
            const clone = template.clone(true);
            clone.position.set(sx, midShelfTopY, 0.07);
            clone.rotation.y = idx * 0.8;
            mount.add(clone);
          });
        }),

        // 3) Shuttlecock Containers — 4 tubes lined up neatly on middle shelf right side
        loadOne('tube', GITHUB_MODELS.tube, (rawScene) => {
          const { template } = normalizeGlbAsset(rawScene, {
            uprightAxis: 'longest',
            targetSize: { x: 0.080, y: 0.325, z: 0.080 },
            anchorY: 'bottom'
          });

          const mount = productSlots.tube.container;
          for (let t = 0; t < 4; t++) {
            const clone = template.clone(true);
            clone.position.set(-0.02 + t * 0.145, midShelfTopY, 0.03);
            mount.add(clone);
          }
        }),

        // 4) Sports Shoes — 9 slots across 3 shelves (full PBR detail, zero specular glare, deep matte tone)
        loadOne('shoes', GITHUB_MODELS.shoes, (rawScene) => {
          // Detect whether shoes.glb is a single shoe or already a pair
          rawScene.updateMatrixWorld(true);
          const rawBox = new THREE.Box3().setFromObject(rawScene);
          const rawSz = rawBox.getSize(new THREE.Vector3());
          const horizMax = Math.max(rawSz.x, rawSz.z);
          const horizMin = Math.min(rawSz.x, rawSz.z);
          const isSingleShoe = horizMin < horizMax * 0.56;

          const { template } = normalizeGlbAsset(rawScene, {
            uprightAxis: 'keepY',
            faceFrontX: true,
            targetSize: isSingleShoe
              ? { x: 0.235, y: 0.115, z: 0.105 }
              : { x: 0.245, y: 0.120, z: 0.215 },
            anchorY: 'bottom'
          });

          tuneShoeGlbMaterials(template);

          const mount = productSlots.shoes.container;
          [1.68, 1.38, 1.08].forEach(sy => {
            const shelfTopY = sy + 0.013;
            [-0.26, 0.0, 0.26].forEach(sx => {
              const slotGroup = new THREE.Group();
              slotGroup.position.set(sx, shelfTopY, 0.02);

              if (isSingleShoe) {
                const backShoe = template.clone(true);
                backShoe.position.set(0.012, 0, -0.042);
                backShoe.rotation.y = 0.22;
                slotGroup.add(backShoe);

                const frontShoe = template.clone(true);
                frontShoe.scale.z *= -1;
                frontShoe.position.set(-0.012, 0, 0.042);
                frontShoe.rotation.y = 0.18;
                slotGroup.add(frontShoe);
              } else {
                const pair = template.clone(true);
                pair.rotation.y = 0.18;
                slotGroup.add(pair);
              }

              mount.add(slotGroup);
            });
          });
        }),

        // 5) Hanging Socks — 3 intact packs hung cleanly via Euro-slot on chrome retail peg hooks
        loadOne('socks', GITHUB_MODELS.socks, (rawScene) => {
          const { template, size } = normalizeGlbAsset(rawScene, {
            uprightAxis: 'longest',
            faceFrontX: true,
            removeTopFloatingIsland: true,
            targetSize: { x: 0.155, y: 0.275, z: 0.085 },
            anchorY: 'top'
          });

          tuneSockGlbMaterials(template);
          alignTopCuffToOrigin(template, size.y, 0.10);

          const mount = productSlots.socks.container;
          // Hook prong sits at y = railY - 0.034 (radius 0.0032); +0.0135 seats the Euro-slot top arch directly onto the prong
          const hookProngY = railY - 0.034;
          const sockTopY = hookProngY + 0.0135;
          const sockZ = railZ + 0.038;

          [-0.26, 0.0, 0.26].forEach(sx => {
            const clone = template.clone(true);
            clone.position.set(sx, sockTopY, sockZ);
            mount.add(clone);
          });
        })
      ]);
    }

    // =========================================================================
    // 7. CAMERA TRANSITIONS, INTERACTION & UI HANDLERS
    // =========================================================================
    function goToView(viewKey) {
      const preset = CAMERA_VIEWS[viewKey];
      if (!preset) return;
      activeView = viewKey;
      controls.autoRotate = false;
      document.getElementById('btn-rotate').classList.remove('active');

      // Highlight matching button across both bottom bar & top-right item panel
      document.querySelectorAll('[data-view]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === viewKey);
      });

      camAnim = {
        startPos: camera.position.clone(),
        endPos: new THREE.Vector3(...preset.pos),
        startTarget: controls.target.clone(),
        endTarget: new THREE.Vector3(...preset.target),
        t: 0
      };

      updateGlassVisibility();
    }

    function updateGlassVisibility() {
      if (!frontGlassGroup) return;
      const camCloseInside = camera.position.z < 1.55 && Math.abs(camera.position.x) < 2.65;
      const shouldHide = userHidGlass || INTERIOR_VIEWS.has(activeView) || camCloseInside;
      frontGlassGroup.visible = !shouldHide;
    }

    function bindUI() {
      // View preset buttons (exterior + item zoom)
      document.querySelectorAll('[data-view]').forEach(btn => {
        btn.addEventListener('click', () => goToView(btn.dataset.view));
      });

      // Collapsible Top-Right Item Panel
      const panelToggle = document.getElementById('toggle-item-panel');
      const panelBody = document.getElementById('item-panel-body');
      const panelChevron = document.getElementById('item-panel-chevron');
      let panelOpen = true;
      panelToggle.addEventListener('click', () => {
        panelOpen = !panelOpen;
        panelBody.classList.toggle('hidden', !panelOpen);
        panelChevron.style.transform = panelOpen ? 'rotate(0deg)' : 'rotate(-90deg)';
      });

      // Door open/close
      const btnDoor = document.getElementById('btn-door');
      btnDoor.addEventListener('click', () => {
        doorOpen = !doorOpen;
        btnDoor.classList.toggle('active', doorOpen);
      });

      // Glass hide/show
      const btnGlass = document.getElementById('btn-glass');
      btnGlass.addEventListener('click', () => {
        userHidGlass = !userHidGlass;
        btnGlass.classList.toggle('active', userHidGlass);
        updateGlassVisibility();
      });

      // Interior lights on/off
      const btnLights = document.getElementById('btn-lights');
      btnLights.addEventListener('click', () => {
        lightsOn = !lightsOn;
        btnLights.classList.toggle('active', lightsOn);
        interiorLights.forEach(item => {
          item.light.intensity = lightsOn ? item.baseIntensity : 0;
        });
        ceilingBulbMats.forEach(m => {
          m.emissiveIntensity = lightsOn ? 1.65 : 0.0;
          m.color.setHex(lightsOn ? 0xfff8e7 : 0xcbd5e1);
        });
      });

      // Dimension overlay toggle
      const btnDims = document.getElementById('btn-dims');
      btnDims.addEventListener('click', () => {
        showDimensions = !showDimensions;
        btnDims.classList.toggle('active', showDimensions);
        if (dimensionsGroup) dimensionsGroup.visible = showDimensions;
      });

      // Auto-rotate toggle
      const btnRotate = document.getElementById('btn-rotate');
      btnRotate.addEventListener('click', () => {
        controls.autoRotate = !controls.autoRotate;
        btnRotate.classList.toggle('active', controls.autoRotate);
        if (controls.autoRotate) camAnim = null;
      });

      // Cancel camera tween if user manually drags/zooms
      controls.addEventListener('start', () => {
        camAnim = null;
      });
    }

    // =========================================================================
    // 8. INITIALIZATION, PRELOADER REVEAL & RENDER LOOP
    // =========================================================================
    function revealApp() {
      const splash = document.getElementById('splash-preloader');
      if (splash) splash.classList.add('hidden-splash');
      document.body.classList.add('app-ready');
    }

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);

      camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 80);
      camera.position.set(...CAMERA_VIEWS.iso.pos);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.06;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      maxAnisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 16);
      container.appendChild(renderer.domElement);

      // Subtle Studio Environment Reflections (keeps background pure white)
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      pmrem.dispose();

      // Balanced Studio Lighting Rig
      const hemi = new THREE.HemisphereLight(0xffffff, 0xe8edf5, 0.64);
      scene.add(hemi);

      const keyLight = new THREE.DirectionalLight(0xffffff, 1.40);
      keyLight.position.set(6.5, 9.5, 7.5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.near = 1.5;
      keyLight.shadow.camera.far = 24;
      keyLight.shadow.camera.left = -3.6;
      keyLight.shadow.camera.right = 3.6;
      keyLight.shadow.camera.top = 3.6;
      keyLight.shadow.camera.bottom = -3.6;
      keyLight.shadow.bias = -0.00035;
      keyLight.shadow.normalBias = 0.015;
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0xeef5ff, 0.48);
      rimLight.position.set(-7.0, 5.5, -6.5);
      scene.add(rimLight);

      // Smooth 360° Orbit Controls with Deep Zoom enabled (minDistance 0.35m)
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(...CAMERA_VIEWS.iso.target);
      controls.enableDamping = true;
      controls.dampingFactor = 0.065;
      controls.enablePan = true;
      controls.minDistance = 0.35;
      controls.maxDistance = 16.0;
      controls.maxPolarAngle = Math.PI / 2 - 0.015;
      controls.autoRotate = false;
      controls.autoRotateSpeed = 1.1;
      controls.update();

      // Build Booth + Load GitHub Artwork & 5 GLB Product Models in parallel
      const artworkReady = buildBooth();
      const modelsReady = loadAllProductGlbs();

      bindUI();

      // Safety fallback timeout (9s) so preloader always opens even on slow networks
      const safetyTimeout = new Promise(resolve => setTimeout(resolve, 9000));
      Promise.race([
        Promise.all([artworkReady, modelsReady]),
        safetyTimeout
      ]).then(() => {
        // Pre-compile shaders & render one clean frame before lifting splash curtain
        renderer.compile(scene, camera);
        renderer.render(scene, camera);
        requestAnimationFrame(() => revealApp());
      });

      window.addEventListener('resize', onResize);
      animate();
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Smooth camera transition tween
      if (camAnim) {
        camAnim.t = Math.min(1, camAnim.t + 0.055);
        const ease = 1 - Math.pow(1 - camAnim.t, 3);
        camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
        controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
        if (camAnim.t >= 1) camAnim = null;
      }

      // Smooth hinged entry door animation (swings outward cleanly along +X to 86°)
      if (doorPivot) {
        const targetAngle = doorOpen ? Math.PI * 0.48 : 0;
        currentDoorAngle += (targetAngle - currentDoorAngle) * 0.10;
        doorPivot.rotation.y = currentDoorAngle;
      }

      updateGlassVisibility();
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = function () {
      try {
        init();
      } catch (err) {
        console.error('3D Viewer init error:', err);
        revealApp();
      }
    };
  </script>
